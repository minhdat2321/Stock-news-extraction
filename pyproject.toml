[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnstock-news"
version = "0.1.0"
description = "Vietnam stock news crawler utilities"
readme = "README.md"
authors = [{name = "vnstock"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.0",
    "pandas>=1.3",
    "beautifulsoup4>=4.9",
    "html2text>=2020.1.16",
    "aiohttp>=3.8",
    "tqdm>=4.64",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
async = ["tqdm[asyncio]>=4.64"]

[project.urls]
Homepage = "https://github.com/vnstock/vnstock_news"

[tool.setuptools.packages.find]
include = ["vnstock_news*"]
